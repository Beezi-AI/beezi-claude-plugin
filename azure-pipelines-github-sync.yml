# Mirrors the prod branch to the public GitHub repo after a release PR merges.
#
# One-way: Azure DevOps -> GitHub. Nothing ever flows back.
#
# Setup before first run:
#   1. Create a GitHub fine-grained PAT with `contents: write` on the target repo.
#   2. Add it to a variable group named `beezi-plugin-release` as a SECRET
#      variable `GITHUB_PAT`, and set `GITHUB_REPO` to `owner/name`.
#   3. Link the variable group to this pipeline.
#
# The first push to a brand-new empty GitHub repo succeeds as a fast-forward.
# If GitHub later diverges, the push fails loudly rather than silently
# discarding commits - re-run with FORCE=true only once you've checked what
# would be lost.

trigger:
    branches:
        include:
            - main

pr: none

pool:
    vmImage: ubuntu-latest

variables:
    - group: beezi-plugin-release

jobs:
    - job: mirror
      displayName: Mirror prod branch to GitHub
      steps:
          - checkout: self
            # Full history: a shallow clone cannot be pushed as a fast-forward.
            fetchDepth: 0
            persistCredentials: false

          - script: bash scripts/sync-to-github.sh
            displayName: Push to GitHub
            env:
                GITHUB_PAT: $(GITHUB_PAT)
                GITHUB_REPO: $(GITHUB_REPO)
                SOURCE_REF: $(Build.SourceVersion)
                TARGET_BRANCH: main
